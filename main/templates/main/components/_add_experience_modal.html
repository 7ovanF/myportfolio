<div id="add-experience-modal"
     class="form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">
    <button type="button"
            class="form-modal__backdrop"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Close add experience form"></button>

    <div class="form-modal__content">
        <button type="button"
                class="form-modal__close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Close add experience form">×</button>

        <h2 id="add-experience-modal-title">Add a New Experience</h2>
        <form id="experience-form"
              method="post"
              class="experience-form">
            {% csrf_token %}
            {% for field in experience_form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-experience-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Add Experience</button>
            </div>
        </form>
    </div>
</div>
    <!-- Choices: a JQuery-less selection tool -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js@11.1.0/public/assets/styles/choices.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/choices.js@11.1.0/public/assets/scripts/choices.min.js"></script>
 <script>
        const choices = new Choices(document.querySelector("select"), {

        });
    </script>
