{# need: section_name, title_query #}
<form method="get"
      id="{{ section_name }}-form-search"
      class="form-search">
    <input type="search"
           name="title"
           id="{{section_name}}-form-search-input"
           value="{{ title_query }}"
           placeholder="Search by title..."
           class="project-search__input"
           aria-label="Search by title">
    <button type="submit" class="button">Search</button>
</form>
